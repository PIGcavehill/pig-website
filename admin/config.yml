backend:
  name: turbo-github
  turbo_site_id: 53bf0a16-4938-45b7-8441-764e57f1b42d
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "site"
    label: "PIG Website Content"
    files:
      - name: "content"
        label: "Site Content"
        file: "content/site.json"
        fields:
          - label: "Top Navigation"
            name: "navigation"
            widget: "list"
            summary: "{{fields.label}} → {{fields.link}}"
            fields:
              - { label: "Menu Label", name: "label", widget: "string" }
              - { label: "Section Link", name: "link", widget: "string", hint: "Examples: #about, #board, #events, #initiatives-detail, #involved, #signup" }

          - label: "Google Sign-Up Form"
            name: "signup_form"
            widget: "object"
            fields:
              - { label: "Form Heading", name: "heading", widget: "string" }
              - { label: "Form Description", name: "description", widget: "text" }
              - { label: "Google Form Embed URL", name: "embed_url", widget: "string", hint: "The full Google Forms URL ending in viewform?embedded=true" }
              - { label: "Public Form Link", name: "open_url", widget: "string", hint: "The public forms.gle responder link" }

          - label: "Homepage Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Top Label", name: "eyebrow", widget: "string" }
              - { label: "Main Headline", name: "headline", widget: "string" }
              - { label: "Intro Text", name: "lead", widget: "text" }
              - { label: "Primary Button Text", name: "primary_button_text", widget: "string" }
              - { label: "Primary Button Link", name: "primary_button_link", widget: "string" }
              - { label: "Secondary Button Text", name: "secondary_button_text", widget: "string" }
              - { label: "Secondary Button Link", name: "secondary_button_link", widget: "string" }

          - label: "Membership Perk Cards"
            name: "initiatives"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Membership Perk Details"
            name: "initiative_details"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Short Description", name: "description", widget: "text" }
              - { label: "Full Details", name: "details", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Button Text", name: "button_text", widget: "string", required: false }
              - { label: "Button Link", name: "button_link", widget: "string", required: false }

          - { label: "Board Introduction", name: "board_intro", widget: "text" }

          - label: "Get Involved"
            name: "get_involved"
            widget: "object"
            fields:
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - { label: "Who Can Join Heading", name: "who_title", widget: "string" }
              - { label: "Who Can Join Text", name: "who_text", widget: "text" }
              - { label: "Button Text", name: "button_text", widget: "string" }
              - { label: "Button Link", name: "button_link", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Slogan", name: "slogan", widget: "string" }

          - label: "Mission Statement"
            name: "mission"
            widget: "object"
            fields:
              - { label: "Paragraph 1", name: "paragraph_1", widget: "text" }
              - { label: "Paragraph 2", name: "paragraph_2", widget: "text" }

          - label: "Board Members"
            name: "board"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }

          - label: "Upcoming Events"
            name: "upcoming_events"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date label (e.g. 'Date soon' or 'Dec 2026')", name: "date_label", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Recent Events"
            name: "recent_events"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Day (e.g. '31')", name: "day", widget: "string", required: false }
              - { label: "Month/Year label (e.g. 'Aug 2026')", name: "date_label", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Instagram Handle", name: "instagram_handle", widget: "string" }
              - { label: "Instagram URL", name: "instagram_url", widget: "string" }
              - { label: "Phone 1", name: "phone_1", widget: "string" }
              - { label: "Phone 2", name: "phone_2", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
